name: Build Android APK
on:
  push: { branches: [ main ] }
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/setup-java@v4
        with: { distribution: 'zulu', java-version: '21' }
      
      - name: Install dependencies
        run: |
          npm install
          npm install @capacitor-firebase/authentication firebase @capacitor/app
          
      - name: Prepare www
        run: |
          mkdir -p www
          cp -r client/* www/
          
      - name: Add Android
        run: npx cap add android
        
      - name: Force Android Config (No Image, Just Color)
        run: |
          # إزالة صلاحيات الصورة وإجبار الخلفية فقط
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />' android/app/src/main/AndroidManifest.xml
          # تغيير لون شاشة البداية الأصلية إلى البنفسجي الداكن وإخفاء الصورة
          echo "<?xml version=\"1.0\" encoding=\"utf-8\"?><resources><color name=\"splash_background\">#1A0B2E</color><style name=\"AppTheme.NoActionBarLaunch\" parent=\"Theme.SplashScreen\"><item name=\"windowBackground\">#1A0B2E</item><item name=\"postSplashScreenTheme\">@style/AppTheme.NoActionBar</item></style></resources>" > android/app/src/main/res/values/styles.xml
          
      - name: Inject Google Auth & Firebase
        run: |
          sed -i '/rgcfaIncludeGoogle/d' android/variables.gradle
          sed -i 's/ext {/ext {\n    rgcfaIncludeGoogle = true/' android/variables.gradle
          cp google-services.json android/app/google-services.json || true
          
      - name: Build APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
        
      - uses: actions/upload-artifact@v4
        with:
          name: chizen-apk
          path: android/app/build/outputs/apk/debug/*.apk
