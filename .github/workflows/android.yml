name: Build Android APK
on:
  push: { branches: [ main ] }
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/setup-java@v4
        with: { distribution: 'zulu', java-version: '21' }
      - name: Install
        run: npm install
      - name: Prepare www
        run: |
          mkdir -p www
          cp -r client/* www/
      - name: Add Android
        run: npx cap add android
      - name: Fix AndroidManifest
        run: |
          # منع إنشاء نسخة جديدة من التطبيق عند العودة إليه
          sed -i 's/android:launchMode="singleTask"/android:launchMode="singleTask"/' android/app/src/main/AndroidManifest.xml || true
      - name: Sync
        run: npx cap sync android
      - name: Build APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
