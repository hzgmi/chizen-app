name: Build Android APK
on:
  push: { branches: [ main ] }
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/setup-java@v4
        with: { distribution: 'zulu', java-version: '21' }
      
      - name: Install dependencies
        run: npm install
        
      - name: Install Capacitor Assets
        run: npm install @capacitor/assets
        
      - name: Prepare www
        run: |
          mkdir -p www
          cp -r client/* www/
          
      - name: Add Android
        run: npx cap add android
        
      - name: Fix AndroidManifest (Permissions)
        run: |
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />' android/app/src/main/AndroidManifest.xml
          
      - name: Generate App Icons
        run: |
          npx capacitor-assets generate --android
          
      - name: Sync Capacitor
        run: npx cap sync android
        
      - name: Build APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
        
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
