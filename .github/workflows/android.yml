name: Build Android APK
on:
  push: { branches: [ main ] }
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/setup-java@v4
        with: { distribution: 'zulu', java-version: '21' }
      
      - name: Install dependencies
        run: |
          npm install
          npm install @capacitor-firebase/authentication firebase @capacitor/app @capacitor/assets
          
      - name: Prepare www
        run: |
          mkdir -p www
          cp -r client/* www/
          
      - name: Add Android
        run: npx cap add android
        
      - name: Apply Plugins & Assets
        run: |
          npx cap sync android
          npx capacitor-assets generate --android
          
      - name: Inject Google Auth
        run: |
          echo "ext { rgcfaIncludeGoogle = true }" >> android/variables.gradle
          cp google-services.json android/app/google-services.json || true
          
      - name: Build APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
        
      - uses: actions/upload-artifact@v4
        with:
          name: chizen-apk
          path: android/app/build/outputs/apk/debug/*.apk
