name: Build Android APK
on:
  push: { branches: [ main ] }
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          check-latest: true
      
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with: { distribution: 'zulu', java-version: '21' }
      
      - name: Install dependencies
        run: |
          npm install
          npm install @capacitor-firebase/authentication firebase @capacitor/app @capacitor/push-notifications
          
      - name: Prepare www
        run: |
          mkdir -p www
          cp -r client/* www/
      - name: Verify Node.js version
        run: |
          node -v
          npm -v
          npm install -g @capacitor/cli@latest

          
      - name: Add Android & Sync
        run: |
      - name: Ensure Android Platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          else
            echo "Android platform already exists."
          fi
          npx cap sync android
          npx cap sync android
          
      - name: Inject Configs Safely
        run: |
          # نسخ ملف جوجل
          cp google-services.json android/app/google-services.json || true
          # إضافة صلاحيات الإنترنت
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />' android/app/src/main/AndroidManifest.xml
          
          # الحل الجذري: إزالة أي أسطر سابقة ثم إضافة المتغير داخل بلوك ext الموجود
          sed -i '/rgcfaIncludeGoogle/d' android/variables.gradle
          sed -i 's/ext {/ext {\n    rgcfaIncludeGoogle = true/' android/variables.gradle
          
      - name: Force Java 21 for Gradle
        run: |
          export JAVA_HOME=$JAVA_HOME_21_X64
          echo "org.gradle.java.home=$JAVA_HOME" >> android/gradle.properties
          
      - name: Build APK
        run: |
          export JAVA_HOME=$JAVA_HOME_21_X64
          cd android && chmod +x gradlew && ./gradlew assembleDebug
        
      - uses: actions/upload-artifact@v4
        with:
          name: chizen-apk
          path: android/app/build/outputs/apk/debug/*.apk
