name: Build Client APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Install dependencies
      run: npm install
    - name: Force Clean Android Folder
      run: # (removed rm -rf android to keep custom icons)
    - name: Add Android platform
      - name: Ensure Android Platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          else
            echo "Android platform already exists."
          fi
      run: npx cap sync android
    - name: Sync Capacitor
      run: npx cap sync
    - name: Build APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: client-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
