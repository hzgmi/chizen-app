<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>التحقق من السند — CHIZEN</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0A0515;--bg2:#150826;--card:#1F0D35;--border:#3A1F5A;--pink:#EC4899;--purple:#A855F7;--green:#10B981;--red:#EF4444;--text:#F5E6FF;--muted:#8B7AA8;}
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif;}
  body{background:radial-gradient(ellipse at 50% 30%,#1F0D35 0%,#150826 40%,#0A0515 100%);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .card{width:100%;max-width:480px;background:linear-gradient(145deg,rgba(31,13,53,0.95),rgba(21,8,38,0.95));border:1px solid var(--border);border-radius:24px;padding:32px 24px;box-shadow:0 30px 80px -20px rgba(0,0,0,0.8);}
  .logo{font-family:'Playfair Display',serif;font-size:42px;font-weight:900;text-align:center;background:linear-gradient(135deg,#ff9a4e,#ff356f,#a72bff,#00cfff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:4px;margin-bottom:20px;}
  .state{display:none;text-align:center;}
  .state.active{display:block;}
  .spinner{width:50px;height:50px;margin:20px auto;border:4px solid rgba(236,72,153,0.2);border-top-color:var(--pink);border-radius:50%;animation:spin 0.8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .icon{font-size:60px;margin-bottom:15px;}
  .valid .icon{color:var(--green);}
  .invalid .icon{color:var(--red);}
  .title{font-size:22px;font-weight:900;margin-bottom:15px;}
  .details{background:rgba(10,5,21,0.6);border:1px solid var(--border);border-radius:14px;padding:16px;margin-top:20px;text-align:right;}
  .row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed rgba(58,31,90,0.4);font-size:14px;}
  .row:last-child{border:none;}
  .label{color:var(--muted);}
  .val{font-weight:900;}
</style>
</head>
<body>
<div class="card">
  <div class="logo">CHIZEN</div>
  <div id="s-loading" class="state active"><div class="spinner"></div><div style="color:var(--muted);">جاري التحقق...</div></div>
  <div id="s-valid" class="state valid"><div class="icon">✓</div><div class="title" style="color:var(--green);">سند صالح</div><div id="v-details" class="details"></div></div>
  <div id="s-invalid" class="state invalid"><div class="icon">✗</div><div class="title" style="color:var(--red);">سند غير صالح</div><div style="color:var(--muted);font-size:13px;">لم يتم العثور على هذا الطلب في النظام</div></div>
</div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
(async function(){
  var id = new URLSearchParams(window.location.search).get('id');
  if(!id){ document.getElementById('s-loading').classList.remove('active'); document.getElementById('s-invalid').classList.add('active'); return; }
  try {
    if(!firebase.apps.length) firebase.initializeApp(window.FIREBASE_CONFIG);
    var doc = await firebase.firestore().collection('verifications').doc(String(id).replace(/[^a-zA-Z0-9_-]/g,'_')).get();
    document.getElementById('s-loading').classList.remove('active');
    if(doc.exists){
      var d = doc.data();
      var h = '<div class="row"><span class="label">رقم الطلب</span><span class="val" style="color:var(--pink);">#'+d.orderId+'</span></div>';
      h += '<div class="row"><span class="label">العميل</span><span class="val">'+d.customerName+'</span></div>';
      h += '<div class="row"><span class="label">الهاتف</span><span class="val" style="direction:ltr;">'+d.customerPhone+'</span></div>';
      h += '<div class="row"><span class="label">الإجمالي</span><span class="val" style="color:var(--pink);">'+d.total+' ر.س</span></div>';
      document.getElementById('v-details').innerHTML = h;
      document.getElementById('s-valid').classList.add('active');
    } else {
      document.getElementById('s-invalid').classList.add('active');
    }
  } catch(e) {
    document.getElementById('s-loading').classList.remove('active');
    document.getElementById('s-invalid').classList.add('active');
  }
})();
</script>
</body>
</html>
