<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>تفاصيل المنتج | CHIZEN</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
body {
  background: #0d1120;
  padding: 0 0 110px 0;
  direction: rtl;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  min-height: 100vh;
  color: #ffffff;
}
html[data-theme="light"] body { background: #f8fafc; color: #0f172a; }
.product-container { width: 100%; max-width: 100%; background: #0d1120; }
html[data-theme="light"] .product-container { background: #f8fafc; }
.product-grid { display: grid; grid-template-columns: 1fr; max-width: 600px; margin: 0 auto; }
.product-gallery { display: flex; flex-direction: column; gap: 15px; padding-top: 10px; }
.main-image {
  width: 100%; background: #ffffff; display: flex; justify-content: center; align-items: center;
  min-height: 300px; overflow: hidden; position: relative; cursor: zoom-in;
}
.main-image img { width: 100%; height: auto; max-height: 400px; object-fit: contain; transition: transform 0.3s; }
.arrow-btn {
  position: absolute; left: 15px; top: 50%; transform: translateY(-50%);
  background: rgba(0,0,0,0.4); border: none; color: white; width: 32px; height: 32px;
  border-radius: 50%; display: flex; align-items: center; justify-content: center;
  cursor: pointer; backdrop-filter: blur(5px); font-size: 14px;
}
.thumbnails { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 5px; padding: 0 15px; }
.thumbnails img {
  width: 60px; height: 60px; object-fit: cover; border-radius: 12px; border: 2px solid transparent;
  cursor: pointer; transition: 0.2s; background: #14182b; padding: 2px;
}
.thumbnails img:hover, .thumbnails img.active { border-color: #ec2a79; }
.lightbox {
  display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.9); z-index: 2000; justify-content: center; align-items: center; cursor: zoom-out;
}
.lightbox img { max-width: 90%; max-height: 90%; border-radius: 10px; }
.product-info { display: flex; flex-direction: column; gap: 10px; padding: 0 15px; }
.product-title { font-size: 18px; font-weight: 700; color: #ffffff; line-height: 1.4; }
html[data-theme="light"] .product-title { color: #0f172a; }
.rating { display: flex; align-items: center; gap: 6px; color: #f5b342; font-size: 13px; }
.rating span { color: #9ca3af; font-size: 12px; }
.price-main-row { display: flex; align-items: center; justify-content: flex-start; gap: 12px; margin-top: 5px; direction: rtl; }
.current-price { font-size: 30px; font-weight: 800; color: #ec2a79; display: flex; align-items: center; gap: 4px; }
.current-price .currency { font-size: 16px; font-weight: 600; }
.old-price { font-size: 16px; color: #6b7280; text-decoration: line-through; }
.currency-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 5px; }
.currency-card {
  background: #151a2d; border: 1px solid #1f2742; border-radius: 12px; padding: 10px 12px;
  display: flex; align-items: center; justify-content: space-between; min-height: 65px;
}
html[data-theme="light"] .currency-card { background: #ffffff; border-color: #e2e8f0; }
.currency-card .currency-info { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
.currency-card .currency-name { font-size: 11px; color: #9ca3af; font-weight: 500; }
.currency-card .currency-value { font-size: 16px; font-weight: 700; color: #ffffff; }
html[data-theme="light"] .currency-card .currency-value { color: #0f172a; }
.currency-card .flag-icon { font-size: 22px; }
.section-title { font-size: 14px; font-weight: 700; color: #ffffff; display: flex; align-items: center; gap: 6px; margin-top: 10px; margin-bottom: 5px; }
html[data-theme="light"] .section-title { color: #0f172a; }
.section-title i { color: #3b82f6; font-size: 14px; }
.sizes-container { display: flex; flex-wrap: wrap; gap: 8px; }
.size-option {
  background: transparent; border: 2px solid #2a3452; color: #e2e8f0; font-weight: 600;
  padding: 6px 18px; border-radius: 20px; font-size: 13px; cursor: pointer; transition: 0.2s; user-select: none;
}
html[data-theme="light"] .size-option { border-color: #cbd5e1; color: #334155; }
.size-option:hover { border-color: #4b5a80; }
.size-option.selected { border-color: #3b82f6; background: rgba(59,130,246,0.1); color: #60a5fa; }
.specs-features-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
.spec-box, .feature-box { background: #151a2d; border-radius: 12px; padding: 12px; border: 1px solid #1f2742; }
html[data-theme="light"] .spec-box, html[data-theme="light"] .feature-box { background: #ffffff; border-color: #e2e8f0; }
.spec-box h3, .feature-box h3 { font-size: 13px; font-weight: 700; color: #ffffff; margin-bottom: 8px; display: flex; align-items: center; gap: 5px; }
html[data-theme="light"] .spec-box h3, html[data-theme="light"] .feature-box h3 { color: #0f172a; }
.spec-box h3 i, .feature-box h3 i { color: #3b82f6; font-size: 13px; }
.spec-list, .feature-list { list-style: none; display: flex; flex-direction: column; gap: 6px; }
.spec-list li, .feature-list li { font-size: 11px; color: #d1d5db; display: flex; align-items: flex-start; gap: 5px; line-height: 1.4; }
html[data-theme="light"] .spec-list li, html[data-theme="light"] .feature-list li { color: #334155; }
.spec-list li i, .feature-list li i { color: #3b82f6; font-size: 10px; margin-top: 3px; }
.feature-list li i.fa-check-circle { color: #10b981; }
.reviews-section { margin-top: 20px; margin-bottom: 15px; }
.review-card { background: #151a2d; border: 1px solid #1f2742; border-radius: 8px; padding: 10px; margin-bottom: 8px; }
html[data-theme="light"] .review-card { background: #ffffff; border-color: #e2e8f0; }
.review-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
.review-user { font-size: 12px; font-weight: 600; color: #e2e8f0; }
html[data-theme="light"] .review-user { color: #0f172a; }
.review-date { font-size: 10px; color: #6b7280; }
.review-stars { color: #f5b342; font-size: 12px; margin-bottom: 5px; }
.review-text { font-size: 11px; color: #d1d5db; line-height: 1.4; margin-bottom: 8px; }
html[data-theme="light"] .review-text { color: #334155; }
.sticky-bar {
  position: fixed; bottom: 0; left: 0; right: 0; background: #0d1120; border-top: 1px solid #1f2742;
  padding: 12px 15px; display: flex; flex-direction: column; gap: 10px; z-index: 999; max-width: 600px; margin: 0 auto;
}
html[data-theme="light"] .sticky-bar { background: #ffffff; border-color: #e2e8f0; }
.sticky-top-row { display: flex; align-items: center; gap: 10px; width: 100%; }
.quantity-selector { display: flex; align-items: center; background: #151a2d; border: 1px solid #2a3452; border-radius: 12px; overflow: hidden; min-width: 110px; }
html[data-theme="light"] .quantity-selector { background: #f8fafc; border-color: #e2e8f0; }
.quantity-btn { background: transparent; border: none; width: 35px; height: 45px; font-size: 20px; font-weight: 600; color: #ffffff; cursor: pointer; transition: 0.2s; }
html[data-theme="light"] .quantity-btn { color: #0f172a; }
.quantity-btn:disabled { color: #4b5563; cursor: not-allowed; }
.quantity-btn:hover:not(:disabled) { background: #1f2742; }
.quantity-input { width: 40px; height: 45px; border: none; text-align: center; font-size: 16px; font-weight: 600; color: #ffffff; background: transparent; outline: none; }
html[data-theme="light"] .quantity-input { color: #0f172a; }
.btn-add-cart {
  background: #1b112b; color: white; border: 1px solid #2a1b40; flex: 1; height: 48px; border-radius: 12px;
  font-weight: 600; font-size: 14px; cursor: pointer; transition: 0.2s;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
}
.btn-add-cart:hover { background: #2a1b40; }
.btn-buy-now {
  background: #ec2a79; color: white; border: none; width: 100%; height: 48px; border-radius: 12px;
  font-weight: 700; font-size: 15px; cursor: pointer; transition: 0.2s;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  box-shadow: 0 4px 12px rgba(236,42,121,0.25);
}
.btn-buy-now:hover { background: #d61f68; }
.toast {
  position: fixed; bottom: 120px; left: 50%; transform: translateX(-50%) translateY(20px);
  background: #10b981; color: white; padding: 10px 20px; border-radius: 30px; font-size: 13px; font-weight: 600;
  box-shadow: 0 10px 25px rgba(16,185,129,0.3); opacity: 0; visibility: hidden;
  transition: all 0.3s ease; z-index: 1000; display: flex; align-items: center; gap: 8px;
}
.toast.show { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }
@media (max-width: 400px) {
  .current-price { font-size: 26px; }
  .product-title { font-size: 16px; }
  .specs-features-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="product-container">
  <div class="product-grid">
    <div class="product-gallery">
      <div class="main-image" onclick="openLightbox()">
        <img id="mainImage" src="https://via.placeholder.com/300" alt="منتج">
        <button class="arrow-btn"><i class="fas fa-chevron-left"></i></button>
      </div>
      <div class="thumbnails" id="thumbnails"></div>
    </div>

    <div class="product-info">
      <h1 class="product-title" id="productTitle">جاري التحميل...</h1>

      <div class="rating">
        <i class="fas fa-star"></i>
        <span id="ratingText">0 (0 تقييم)</span>
      </div>

      <div class="price-main-row">
        <div class="current-price"><span id="currentPrice">0</span> <span class="currency">ر.ي</span></div>
        <div class="old-price" id="oldPrice"></div>
      </div>

      <div class="currency-cards">
        <div class="currency-card">
          <div class="currency-info"><span class="currency-name">سعودي</span><span class="currency-value" id="priceSAR">0</span></div>
          <div class="flag-icon">🇸🇦</div>
        </div>
        <div class="currency-card">
          <div class="currency-info"><span class="currency-name">دولار</span><span class="currency-value" id="priceUSD">0</span></div>
          <div class="flag-icon">🇺🇸</div>
        </div>
      </div>

      <div id="sizesSection" style="display:none;">
        <div class="section-title"><i class="fas fa-box-open"></i> اختر العبوة</div>
        <div class="sizes-container" id="sizesContainer"></div>
      </div>

      <div class="specs-features-grid">
        <div class="spec-box" id="specBox" style="display:none;">
          <h3><i class="fas fa-cogs"></i> المواصفات</h3>
          <ul class="spec-list" id="specList"></ul>
        </div>
        <div class="feature-box" id="featureBox" style="display:none;">
          <h3><i class="fas fa-gem"></i> المميزات</h3>
          <ul class="feature-list" id="featureList"></ul>
        </div>
      </div>

      <div id="descSection" style="display:none; margin-top:15px;">
        <div class="section-title"><i class="fas fa-file-alt"></i> الوصف</div>
        <p id="descText" style="font-size:13px; color:#d1d5db; line-height:1.7;"></p>
      </div>

      <div class="reviews-section">
        <div class="section-title"><i class="fas fa-comments"></i> تقييمات العملاء</div>
        <div id="reviewFormContainer" class="add-review-form">
          <div class="star-rating-input" id="starInput">
            <i class="fas fa-star" data-value="1"></i>
            <i class="fas fa-star" data-value="2"></i>
            <i class="fas fa-star" data-value="3"></i>
            <i class="fas fa-star" data-value="4"></i>
            <i class="fas fa-star" data-value="5"></i>
          </div>
          <textarea id="reviewText" class="form-textarea" placeholder="أضف تعليقاً (اختياري)..."></textarea>
          <button class="btn-submit-review" onclick="submitReview()">
            <i class="fas fa-paper-plane"></i> إرسال التقييم
          </button>
        </div>
        <div id="alreadyReviewedMsg" class="already-reviewed-msg" style="display:none;">
          <i class="fas fa-check-circle"></i> لقد قمت بتقييم هذا المنتج مسبقاً. شكراً لك!
        </div>
        <div id="reviewsList"></div>
      </div>
    </div>
  </div>
</div>

<div class="sticky-bar">
  <div class="sticky-top-row">
    <div class="quantity-selector">
      <button class="quantity-btn" id="btnMinus" onclick="decreaseQty()" disabled>−</button>
      <input type="text" class="quantity-input" id="qtyInput" value="1" readonly>
      <button class="quantity-btn" onclick="increaseQty()">+</button>
    </div>
    <button class="btn-add-cart" onclick="addToCart()">
      <i class="fas fa-shopping-cart"></i> أضف للسلة
    </button>
  </div>
  <button class="btn-buy-now" onclick="buyNow()">
    <i class="fas fa-bolt"></i> اشترِ الآن
  </button>
</div>

<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <img src="" id="lightboxImg" alt="صورة مكبرة">
</div>

<div class="toast" id="toast">
  <i class="fas fa-check-circle"></i>
  <span>تمت الإضافة بنجاح!</span>
</div>

<script>
// Firebase init
var firebaseConfig = window.FIREBASE_CONFIG || {};
if (firebaseConfig.apiKey && !firebase.apps.length) {
  firebase.initializeApp(firebaseConfig);
}
var db = firebase.firestore();
var productId = new URLSearchParams(window.location.search).get('id');
var currentProduct = null;

if (!productId) {
  document.getElementById('productTitle').textContent = '⚠️ لم يتم تحديد منتج';
} else {
  db.collection('products').doc(productId).get().then(function(doc) {
    if (!doc.exists) {
      document.getElementById('productTitle').textContent = '⚠️ المنتج غير موجود';
      return;
    }
    var p = doc.data();
    p.id = doc.id;
    currentProduct = p;
    renderProduct(p);
  }).catch(function(e) {
    document.getElementById('productTitle').textContent = '⚠️ خطأ في التحميل';
    console.error(e);
  });
}

function renderProduct(p) {
  document.title = (p.name || 'منتج') + ' | CHIZEN';
  
  // الاسم
  document.getElementById('productTitle').textContent = p.name || 'منتج';
  
  // التقييم
  document.getElementById('ratingText').textContent = (p.rating || 4.5) + ' (' + (p.reviews || 0) + ' تقييم)';
  
  // السعر
  var priceYER = Number(p.priceYER || p.price) || 0;
  var oldPrice = Number(p.oldPriceYER || p.oldPrice) || 0;
  document.getElementById('currentPrice').textContent = Math.round(priceYER).toLocaleString('en');
  if (oldPrice > priceYER) {
    document.getElementById('oldPrice').textContent = Math.round(oldPrice).toLocaleString('en') + ' ر.ي';
  } else {
    document.getElementById('oldPrice').style.display = 'none';
  }
  
  // العملات
  document.getElementById('priceSAR').textContent = (Number(p.priceSAR) || (priceYER / 135)).toFixed(2);
  document.getElementById('priceUSD').textContent = (Number(p.priceUSD) || (priceYER / 505)).toFixed(2);
  
  // الصور
  var images = (p.images && p.images.length) ? p.images : (p.img ? [p.img] : []);
  var mainImg = document.getElementById('mainImage');
  var thumbs = document.getElementById('thumbnails');
  
  if (images.length > 0) {
    mainImg.src = images[0];
    if (images.length > 1) {
      images.forEach(function(src, i) {
        var img = document.createElement('img');
        img.src = src;
        if (i === 0) img.classList.add('active');
        img.onclick = function() { changeImage(this, src); };
        thumbs.appendChild(img);
      });
    }
  }
  
  // المقاسات
  if (p.sizes && p.sizes.length > 0) {
    document.getElementById('sizesSection').style.display = 'block';
    var container = document.getElementById('sizesContainer');
    p.sizes.forEach(function(s, i) {
      var div = document.createElement('div');
      div.className = 'size-option' + (i === 0 ? ' selected' : '');
      div.textContent = s;
      div.onclick = function() { selectSize(this); };
      container.appendChild(div);
    });
  }
  
  // المواصفات
  if (p.specs && Object.keys(p.specs).length > 0) {
    document.getElementById('specBox').style.display = 'block';
    var list = document.getElementById('specList');
    Object.keys(p.specs).forEach(function(k) {
      var li = document.createElement('li');
      li.innerHTML = '<i class="fas fa-circle"></i> ' + k + ': ' + p.specs[k];
      list.appendChild(li);
    });
  }
  
  // المميزات
  if (p.features && p.features.length > 0) {
    document.getElementById('featureBox').style.display = 'block';
    var list = document.getElementById('featureList');
    p.features.forEach(function(f) {
      var li = document.createElement('li');
      li.innerHTML = '<i class="fas fa-check-circle"></i> ' + f;
      list.appendChild(li);
    });
  }
  
  // الوصف (إذا لم توجد مميزات)
  if (p.desc && (!p.features || p.features.length === 0)) {
    document.getElementById('descSection').style.display = 'block';
    document.getElementById('descText').textContent = p.desc;
  }
}

function changeImage(thumb, src) {
  document.querySelectorAll('.thumbnails img').forEach(function(img) { img.classList.remove('active'); });
  thumb.classList.add('active');
  document.getElementById('mainImage').src = src;
}

function openLightbox() {
  document.getElementById('lightboxImg').src = document.getElementById('mainImage').src;
  document.getElementById('lightbox').style.display = 'flex';
}

function closeLightbox() {
  document.getElementById('lightbox').style.display = 'none';
}

function selectSize(el) {
  document.querySelectorAll('.size-option').forEach(function(opt) { opt.classList.remove('selected'); });
  el.classList.add('selected');
}

function increaseQty() {
  var input = document.getElementById('qtyInput');
  input.value = parseInt(input.value) + 1;
  document.getElementById('btnMinus').disabled = false;
}

function decreaseQty() {
  var input = document.getElementById('qtyInput');
  var val = parseInt(input.value);
  if (val > 1) input.value = val - 1;
  if (parseInt(input.value) === 1) document.getElementById('btnMinus').disabled = true;
}

function showToast(msg) {
  var toast = document.getElementById('toast');
  toast.querySelector('span').textContent = msg;
  toast.classList.add('show');
  setTimeout(function() { toast.classList.remove('show'); }, 2500);
}

function addToCart() {
  if (!currentProduct) return;
  var qty = parseInt(document.getElementById('qtyInput').value);
  if (window.parent && window.parent.APP) {
    window.parent.APP.addCart(currentProduct.id, qty);
    showToast('✅ تمت الإضافة للسلة (' + qty + ')');
  } else {
    showToast('✅ تمت الإضافة (' + qty + ')');
  }
}

function buyNow() {
  if (!currentProduct) return;
  var qty = parseInt(document.getElementById('qtyInput').value);
  if (window.parent && window.parent.APP) {
    window.parent.APP.addCart(currentProduct.id, qty);
    setTimeout(function() {
      window.parent.APP.goTab('cart');
    }, 300);
  } else {
    showToast('جاري التوجيه للدفع...');
  }
}

// الثيم
var savedTheme = localStorage.getItem('theme') || 'dark';
document.documentElement.setAttribute('data-theme', savedTheme);
</script>

<style id="chz-reviews-css">
.add-review-form {
  background: #151a2d;
  border: 1px solid #1f2742;
  border-radius: 10px;
  padding: 12px;
  margin-bottom: 15px;
}
html[data-theme="light"] .add-review-form { background: #ffffff; border-color: #e2e8f0; }
.star-rating-input {
  display: flex; gap: 6px; margin-bottom: 10px;
  direction: ltr; justify-content: center;
}

}
.star-rating-input i:hover { transform: scale(1.1); }
.star-rating-input i.active { color: #f5b342; }

  color: #fff; padding: 8px 10px; border-radius: 8px; margin-bottom: 10px;

html[data-theme="light"] .form-textarea { background: #f8fafc; color: #0f172a; border-color: #e2e8f0; }
.btn-submit-review {
  background: #3b82f6; color: #fff; border: none; padding: 8px 15px;
  border-radius: 8px; font-weight: 600; font-size: 12px; cursor: pointer;
  transition: 0.2s; width: 100%; display: flex; align-items: center; justify-content: center; gap: 6px;

.btn-submit-review:hover { background: #2563eb; }
.review-actions {
  display: flex; gap: 15px; align-items: center;
  border-top: 1px solid #1f2742; padding-top: 8px; margin-top: 4px;
}
.action-btn {
  background: transparent; border: none; color: #9ca3af; font-size: 11px;
  cursor: pointer; display: flex; align-items: center; gap: 5px;
  transition: 0.2s; padding: 4px 8px; border-radius: 6px;
}
.action-btn:hover { background: rgba(255,255,255,0.05); color: #e2e8f0; }
.action-btn i { font-size: 14px; }
.action-btn.active-like, .action-btn.active-like i { color: #3b82f6; }
.action-btn.active-dislike, .action-btn.active-dislike i { color: #ef4444; }
.already-reviewed-msg {
  background: rgba(16,185,129,0.1); border: 1px solid #10b981; color: #10b981;
  padding: 10px; border-radius: 8px; font-size: 12px; text-align: center;
  font-weight: 600; margin-bottom: 15px;
}
</style>

<script>
// REVIEWS-AND-SIZES
(function(){
  var selectedRating = 0;
  var currentUserId = null;

  // المستخدم المجهول (إذا لم يكن مسجلاً)
  try {
    var user = JSON.parse(localStorage.getItem('chz_user') || '{}');
    currentUserId = user.uid || 'guest_' + Math.random().toString(36).substr(2, 9);
    if (!user.uid) localStorage.setItem('chz_guest_id', currentUserId);
  } catch(e) { currentUserId = 'guest_' + Math.random().toString(36).substr(2, 9); }

  // تفعيل النجوم
  setTimeout(function() {
    var stars = document.querySelectorAll('#starInput i');
    stars.forEach(function(star) {
      star.addEventListener('mouseover', function() { highlightStars(this.dataset.value); });
      star.addEventListener('mouseout', function() { highlightStars(selectedRating); });
      star.addEventListener('click', function() {
        selectedRating = this.dataset.value;
        highlightStars(selectedRating);
      });
    });
  }, 500);

  window.highlightStars = function(count) {
    document.querySelectorAll('#starInput i').forEach(function(star) {
      if (star.dataset.value <= count) star.classList.add('active');
      else star.classList.remove('active');
    });
  };

  // إرسال تقييم
  window.submitReview = function() {
    if (selectedRating === 0) {
      showToast('⚠️ اختر عدد النجوم أولاً');
      return;
    }
    var text = document.getElementById('reviewText').value.trim();
    if (!currentProduct) return;

    var review = {
      productId: currentProduct.id,
      userId: currentUserId,
      rating: Number(selectedRating),
      text: text,
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      likes: 0,
      dislikes: 0
    };

    db.collection('reviews').add(review).then(function() {
      showToast('✅ تم إرسال تقييمك');
      document.getElementById('reviewFormContainer').style.display = 'none';
      document.getElementById('alreadyReviewedMsg').style.display = 'block';
      loadReviews();
    }).catch(function(e) {
      showToast('❌ فشل: ' + e.message);
    });
  };

  // جلب التقييمات
  function loadReviews() {
    if (!currentProduct) return;
    db.collection('reviews')
      .where('productId', '==', currentProduct.id)
      .orderBy('createdAt', 'desc')
      .limit(10)
      .get()
      .then(function(snapshot) {
        var list = document.getElementById('reviewsList');
        list.innerHTML = '';
        if (snapshot.empty) {
          list.innerHTML = '<div style="text-align:center;padding:15px;color:#94a3b8;font-size:12px;">لا توجد تقييمات بعد. كن أول من يقيم!</div>';
          return;
        }
        snapshot.forEach(function(doc) {
          var r = doc.data();
          var starsHtml = '';
          for (var i = 1; i <= 5; i++) {
            starsHtml += '<i class="' + (i <= r.rating ? 'fas' : 'far') + ' fa-star"></i>';
          }
          var card = document.createElement('div');
          card.className = 'review-card';
          card.innerHTML = 
            '<div class="review-header"><span class="review-user">' + (r.userId === currentUserId ? 'أنت' : 'عميل') + '</span><span class="review-date">' + (r.createdAt ? 'مؤخراً' : 'الآن') + '</span></div>' +
            '<div class="review-stars">' + starsHtml + '</div>' +
            '<p class="review-text">' + (r.text || '<em style="color:#6b7280;">تقييم سريع</em>') + '</p>' +
            '<div class="review-actions">' +
              '<button class="action-btn" onclick="voteReview(\'' + doc.id + '\', \'like\', this)"><i class="far fa-thumbs-up"></i> <span>' + (r.likes || 0) + '</span></button>' +
              '<button class="action-btn" onclick="voteReview(\'' + doc.id + '\', \'dislike\', this)"><i class="far fa-thumbs-down"></i> <span>' + (r.dislikes || 0) + '</span></button>' +
            '</div>';
          list.appendChild(card);
        });
      });
  }

  window.voteReview = function(reviewId, type, btn) {
    var field = type === 'like' ? 'likes' : 'dislikes';
    var span = btn.querySelector('span');
    var count = parseInt(span.textContent) + 1;
    span.textContent = count;
    btn.classList.add(type === 'like' ? 'active-like' : 'active-dislike');
    btn.disabled = true;
    db.collection('reviews').doc(reviewId).update({
      [field]: firebase.firestore.FieldValue.increment(1)
    }).catch(function() {});
  };

  // المقاسات
  setTimeout(function() {
    if (currentProduct && currentProduct.sizes && currentProduct.sizes.length > 0) {
      document.getElementById('sizesSection').style.display = 'block';
      var container = document.getElementById('sizesContainer');
      container.innerHTML = '';
      currentProduct.sizes.forEach(function(s, i) {
        var div = document.createElement('div');
        div.className = 'size-option' + (i === 0 ? ' selected' : '');
        div.textContent = s;
        div.onclick = function() { selectSize(this); };
        container.appendChild(div);
      });
    }
  }, 1000);

  // تحميل التقييمات عند جاهزية المنتج
  var loadTimer = setInterval(function() {
    if (currentProduct) {
      clearInterval(loadTimer);
      loadReviews();
    }
  }, 500);
})();
</script>
</body>
</html>
