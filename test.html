<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>اختبار القوائم</title>
  <style>
    body { background: #0f0f1a; color: #fff; font-family: sans-serif; padding: 20px; }
    select { width: 100%; padding: 15px; font-size: 16px; border-radius: 10px; margin-bottom: 20px; }
  </style>
</head>
<body>
  <h1>اختبار القائمة المخصصة</h1>
  <label>شركة الطيران:</label>
  <select id="test-select">
    <option value="">اختر...</option>
    <option value="1">الخطوط اليمنية</option>
    <option value="2">طيران الإمارات</option>
    <option value="3">الخطوط السعودية</option>
  </select>

  <script>
    document.addEventListener('click', function(e) {
      if (e.target.tagName === 'SELECT') {
        e.preventDefault();
        var sel = e.target;
        var modal = document.createElement('div');
        modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:9999;display:flex;align-items:center;justify-content:center;';
        var box = document.createElement('div');
        box.style.cssText = 'background:#1A2340;padding:20px;border-radius:15px;width:80%;max-width:400px;color:#F2E3C6;border:1px solid #C5A059;';
        
        Array.from(sel.options).forEach(function(opt) {
          if (opt.value === '') return;
          var btn = document.createElement('button');
          btn.textContent = opt.textContent;
          btn.style.cssText = 'display:block;width:100%;padding:12px;margin-bottom:10px;background:transparent;border:1px solid #C5A059;color:#C5A059;border-radius:8px;font-weight:bold;';
          btn.onclick = function() {
            sel.value = opt.value;
            modal.remove();
          };
          box.appendChild(btn);
        });
        
        var close = document.createElement('button');
        close.textContent = 'إغلاق';
        close.style.cssText = 'width:100%;padding:10px;background:transparent;border:none;color:#888;margin-top:10px;';
        close.onclick = function() { modal.remove(); };
        box.appendChild(close);
        
        modal.appendChild(box);
        document.body.appendChild(modal);
      }
    });
  </script>
</body>
</html>
